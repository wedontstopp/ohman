name: Export current Apex HTML
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-apex-html.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: |
          test -f Apex-v027.html
          test "$(head -c 15 Apex-v027.html)" = '<!DOCTYPE html>'
      - name: Attach original HTML
        uses: actions/upload-artifact@v4
        with:
          name: Apex-v027-html
          path: Apex-v027.html
          if-no-files-found: error
